  // ---------------- picking (grid DDA in figure space)
  pick(clientX, clientY, canvasRect) {
    if (!this.level) return -1;
    const ndc = new THREE.Vector2(((clientX - canvasRect.left) / canvasRect.width) * 2 - 1, -((clientY - canvasRect.top) / canvasRect.height) * 2 + 1);
    const ray = new THREE.Raycaster();
    ray.setFromCamera(ndc, this.camera);
    this.content.updateMatrixWorld();
    const inv = new THREE.Matrix4().copy(this.content.matrixWorld).invert();
    const o = ray.ray.origin.clone().applyMatrix4(inv);
    const d = ray.ray.direction.clone().transformDirection(inv).normalize();
    const g = this.dda(o, d);
    let best = g.v, bestT = g.t;
    if (this.ringList.length) {
      const lo = new THREE.Vector3(), ld = new THREE.Vector3(), h = CUBE / 2;
      for (const v of this.ringList) {
        if (!this.alive[v] || this.hidden[v] || this.instOf[v] < 0) continue;
        const iv = this.ringInv.get(v);
        lo.copy(o).applyMatrix4(iv); ld.copy(d).transformDirection(iv);
        let t0 = 0, t1 = bestT;
        for (const a of ['x', 'y', 'z']) {
          if (Math.abs(ld[a]) < 1e-9) { if (Math.abs(lo[a]) > h) { t0 = 1; t1 = 0; } continue; }
          let ta = (-h - lo[a]) / ld[a], tb = (h - lo[a]) / ld[a];
          if (ta > tb) [ta, tb] = [tb, ta];
          t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
          if (t0 > t1) break;
        }
        if (t0 <= t1 && t0 < bestT) { bestT = t0; best = v; }
      }
    }
    return best;
  }
  /** Grid walk in figure space; ring cubes are skipped (they are picked as rotated boxes).

  dda(o, d) {
    const { W, H, D } = this, L = this.level, NO = { v: -1, t: Infinity };
    let tmin = 0, tmax = 1e9;
    const lo = [0, 0, 0], hi = [W, H, D], oa = [o.x, o.y, o.z], da = [d.x, d.y, d.z];
    for (let a = 0; a < 3; a++) {
      if (Math.abs(da[a]) < 1e-9) { if (oa[a] < lo[a] || oa[a] > hi[a]) return NO; continue; }
      let t1 = (lo[a] - oa[a]) / da[a], t2 = (hi[a] - oa[a]) / da[a];
      if (t1 > t2) [t1, t2] = [t2, t1];
      tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
      if (tmin > tmax) return NO;
    }
    const p = [oa[0] + da[0] * (tmin + 1e-4), oa[1] + da[1] * (tmin + 1e-4), oa[2] + da[2] * (tmin + 1e-4)];
    let x = Math.min(W - 1, Math.max(0, Math.floor(p[0]))), y = Math.min(H - 1, Math.max(0, Math.floor(p[1]))), z = Math.min(D - 1, Math.max(0, Math.floor(p[2])));
    const sx = da[0] > 0 ? 1 : -1, sy = da[1] > 0 ? 1 : -1, sz = da[2] > 0 ? 1 : -1;
    const tdx = Math.abs(1 / da[0]), tdy = Math.abs(1 / da[1]), tdz = Math.abs(1 / da[2]);

    let tmy = da[1] !== 0 ? ((sy > 0 ? y + 1 - p[1] : p[1] - y) * tdy) : Infinity;
    let tmz = da[2] !== 0 ? ((sz > 0 ? z + 1 - p[2] : p[2] - z) * tdz) : Infinity;
    let tc = 0;
    for (let i = 0; i < 600; i++) {

      const v = L.cellToVoxel[x + W * (z + D * y)];
      if (v >= 0 && this.alive[v] && !this.hidden[v] && !(this.ringM && this.ringM[v])) return { v, t: tmin + tc };

  }

  // ---------------- coordinates
  voxelWorld(v, out = new THREE.Vector3()) {
    const L = this.level, r = this.ringM && this.ringM[v];
    if (r) out.setFromMatrixPosition(r); else out.set(L.pos[v * 3] + 0.5, L.pos[v * 3 + 1] + 0.5, L.pos[v * 3 + 2] + 0.5);
    this.content.updateMatrixWorld();

  }
  /** World → CSS pixels relative to the canvas. */
  toScreen(p) {
    const v = p.clone().project(this.camera);
    return { x: (v.x + 1) / 2 * this.canvasW, y: (1 - v.y) / 2 * this.canvasH, z: v.z };
  }
  /** CSS pixel on the canvas → world point `frac` of the way from the camera to the figure centre. */
  fromScreen(x, y, frac = 0.35) {
    const ndc = new THREE.Vector3(x / this.canvasW * 2 - 1, -(y / this.canvasH) * 2 + 1, 0.5).unproject(this.camera);
    const dir = ndc.sub(this.camera.position).normalize();
    const dist = this.camera.position.distanceTo(this.target()) * frac;
    return this.camera.position.clone().addScaledVector(dir, dist);

  // ---------------- animation primitives
  tween(dur, step, done, delay = 0) { this.tweens.push({ t0: this.now + delay, dur, step, done }); this.dirty = true; }
  get busy() { return this.tweens.length > 0 || !!this.flyMesh || !!this.debris || this.particles.alive > 0; }

  /** Magnet flight from a screen point to a voxel; resolves when it arrives. */
  flyMagnetTo(fromScreen, v, hex, pol, dur = 0.44) {
    return new Promise(resolve => {
      const key = hex + pol;
      this.magMats = this.magMats || new Map();
      if (!this.magMats.has(key)) this.magMats.set(key, magnetMaterial(hex, pol));
      this.ballGeo = this.ballGeo || new THREE.SphereGeometry(1, 40, 28);
      const ball = new THREE.Mesh(this.ballGeo, this.magMats.get(key));
      ball.castShadow = false;
      this.scene.add(ball);
      const start = this.fromScreen(fromScreen.x, fromScreen.y, 0.42);
      const end = this.voxelWorld(v);
      // stop at the cube's face towards the camera
      const toCam = this.camera.position.clone().sub(end).normalize();
      end.addScaledVector(toCam, 0.95);
      const mid = start.clone().lerp(end, 0.5); mid.y += 1.6 + start.distanceTo(end) * 0.1;

      this.tween(dur, (u) => {

        const e = 1 - Math.pow(1 - u, 2.6);

        ball.position.copy(a).lerp(b, e);
        ball.scale.setScalar(r0 + (r1 - r0) * (1 - Math.pow(1 - u, 1.8)));
        ball.lookAt(this.camera.position);
        if (u > 0.06 && (trail++ % 2 === 0)) this.particles.trail(ball.position, hex);

    });
  }
  removeBall(ball, pop = true) {
    if (!ball) return;
    if (!pop) { ball.parent?.remove(ball); return; }
    const s0 = ball.scale.x;
    this.tween(0.24, (u) => { const k = u < 0.35 ? u / 0.35 : 1; ball.scale.setScalar(s0 * (u < 0.35 ? 1 + 0.12 * Math.sin(k * Math.PI / 2) : 1.12 * Math.pow(1 - (u - 0.35) / 0.65, 2))); }, () => ball.parent?.remove(ball));
  }

  /** The attraction: a wave runs through the group from the struck cube, each cube lifts a little,
   *  then glides on a soft curve into the magnet, shrinking and turning; the magnet swells as they
   *  arrive, then closes with a sparkle. Nothing is allocated per frame. */
  attract(removed, ball, colorHex, reduceMotion, hitVoxel = -1) {
    return new Promise(resolve => {
      const S = shared();
      const n = removed.length;
      const center = ball.position.clone();
      const mesh = new THREE.InstancedMesh(S.cubeGeoLow, this.flyMat, n);
      cubeAttributes(mesh.geometry, n);
      const pol = mesh.geometry.getAttribute('aPol'), st = mesh.geometry.getAttribute('aState'), frA = mesh.geometry.getAttribute('aFrost');
      const starts = [], ctrl = [], delays = [], spins = [], rots = [], dur = [];
      const yawQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), this.turn.rotation.y);
      const origin = hitVoxel >= 0 ? this.voxelWorld(hitVoxel) : center;
      let far = 0.001;
      removed.forEach((v) => { const p = this.voxelWorld(v); starts.push(p); far = Math.max(far, p.distanceTo(origin)); });
      const spread = reduceMotion ? 0 : Math.min(0.38, 0.12 + n * 0.004);
      const up = new THREE.Vector3(0, 1, 0);
      removed.forEach((v, i) => {
        mesh.setColorAt(i, this.colors[v]);
        pol.array[i] = (this.level.type[v] & 1) ? -1 : 1; st.array[i] = 1; frA.array[i] = 0;
        const q0 = yawQ.clone(); if (this.ringM[v]) q0.multiply(new THREE.Quaternion().setFromRotationMatrix(this.ringM[v]));
        rots.push(q0);
        delays.push(spread * starts[i].distanceTo(origin) / far + Math.random() * 0.03);
        spins.push(new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize());
        // control point: halfway, lifted and pushed sideways a little, so the paths curve like a swirl
        const a = starts[i], dir = center.clone().sub(a), side = new THREE.Vector3().crossVectors(dir, up).normalize();
        ctrl.push(a.clone().lerp(center, 0.45).addScaledVector(up, 0.6 + dir.length() * 0.12).addScaledVector(side, (i % 2 ? 1 : -1) * dir.length() * 0.12));
        dur.push(reduceMotion ? 0.2 : 0.46 + Math.random() * 0.1);

          } else {

  /** Wrong magnet: knock, flash the cubes, bounce back. Resolves with the bounce point. */
  bounce(ball, v, reduceMotion) {
    return new Promise(resolve => {
      const start = ball.position.clone();
      const back = start.clone().add(this.camera.position.clone().sub(start).normalize().multiplyScalar(2.2));
      back.y += 1.6;
      // shake the struck cube's group a little
      const off = 0.12;
      this.tween(0.16, (u) => { this.content.position.x = -this.W / 2 + (reduceMotion ? 0 : Math.sin(u * Math.PI * 4) * off * (1 - u)); }, () => { this.content.position.x = -this.W / 2; });
      this.tween(0.3, (u) => {
        const e = 1 - Math.pow(1 - u, 2);
        ball.position.lerpVectors(start, back, e);
        ball.position.y += Math.sin(u * Math.PI) * 0.6;
        ball.lookAt(this.camera.position);
      }, () => resolve(ball.position.clone()));
    });
  }

  /** Storage overload: the figure falls apart. */
  collapse() {
    const S = shared(), L = this.level;
    const list = [];
    for (let v = 0; v < L.n; v++) if (this.alive[v] && this.instOf[v] >= 0) list.push(v);
    const n = list.length;
    const mesh = new THREE.InstancedMesh(S.cubeGeo.clone(), this.flyMat, n);
    cubeAttributes(mesh.geometry, n);
    const pol = mesh.geometry.getAttribute('aPol');
    const parts = list.map((v, i) => {
      mesh.setColorAt(i, this.colors[v]);
      pol.array[i] = (L.type[v] & 1) ? -1 : 1;
      const p = new THREE.Vector3();
      if (this.ringM[v]) p.setFromMatrixPosition(this.ringM[v]); else p.set(L.pos[v * 3] + 0.5, L.pos[v * 3 + 1] + 0.5, L.pos[v * 3 + 2] + 0.5);
      p.x -= this.W / 2; p.z -= this.D / 2;
      p.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.turn.rotation.y);
      const q0 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), this.turn.rotation.y);
      if (this.ringM[v]) q0.multiply(new THREE.Quaternion().setFromRotationMatrix(this.ringM[v]));
      const out = new THREE.Vector3(p.x, 0, p.z).normalize();
      return { p, v: out.multiplyScalar(1.5 + Math.random() * 3).add(new THREE.Vector3(0, 2 + Math.random() * 4, 0)), a: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize(), w: (Math.random() - 0.5) * 8, ang: 0, q0, delay: (p.y / Math.max(1, this.topY)) * 0.25 * Math.random() + (1 - p.y / Math.max(1, this.topY)) * 0.15 };
    });
    for (const v of list) this.hidden[v] = 1;
    this.rebuild();
    for (const d of this.decor) d.obj.visible = false;
    mesh.frustumCulled = false; mesh.castShadow = true;
    this.scene.add(mesh);
    this.debris = { mesh, parts, t: 0 };
  }

  // ---------------- per-frame
  update(dt, now) {
    this.now = now;
    shared().time.value = now;
    // turntable inertia
    if (Math.abs(this.yawVel) > 0.0005) { this.yaw += this.yawVel * dt; this.yawVel *= Math.exp(-dt * 6); this.dirty = true; }
    else this.yawVel = 0;
    this.turn.rotation.y = this.yaw;
    // tweens
    if (this.tweens.length) {
      const list = this.tweens;
      this.tweens = [];               // callbacks may add new tweens
      const keep = [];
      for (const tw of list) {
        if (now < tw.t0) { keep.push(tw); continue; }
        const u = tw.dur > 0 ? Math.min(1, (now - tw.t0) / tw.dur) : 1;
        tw.step?.(u);
        if (u >= 1) tw.done?.(); else keep.push(tw);
      }
      this.tweens = keep.concat(this.tweens);
      this.dirty = true;
    }
    if (this.debris) this.stepDebris(dt);
    if (this.particles.alive > 0) { this.particles.update(dt, this.camera); this.dirty = true; }
    if (this.hintActive || (this.outline && this.outline.count > 0)) this.dirty = true;
  }
  stepDebris(dt) {
    const D = this.debris; D.t += dt;
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1);
    let moving = 0;
    D.parts.forEach((p, i) => {
      if (D.t > p.delay) {
        p.v.y -= 22 * dt;
        p.p.addScaledVector(p.v, dt);
        if (p.p.y < 0.47) {
          const inside = Math.hypot(p.p.x, p.p.z) < this.platR;
          if (inside) { p.p.y = 0.47; p.v.y *= -0.32; p.v.x *= 0.7; p.v.z *= 0.7; p.w *= 0.6; }
        }
        p.ang += p.w * dt;
        if (p.v.lengthSq() > 0.05 || p.p.y > 0.5) moving++;
      } else moving++;
      q.setFromAxisAngle(p.a, p.ang).multiply(p.q0);
      const fade = D.t > 1.6 ? Math.max(0, 1 - (D.t - 1.6) / 0.6) : 1;
      s.setScalar(0.96 * fade + 0.001);
      m.compose(p.p, q, s);
      D.mesh.setMatrixAt(i, m);
    });
    D.mesh.instanceMatrix.needsUpdate = true;
    this.dirty = true;
    if (D.t > 2.3) { D.mesh.parent?.remove(D.mesh); this.debris = null; }
  }
  render() {
    this.frame();
    // the shadow map is redrawn only when the figure changed or turned
    const sk = `${this.turn.rotation.y.toFixed(4)}|${this.shadowRev}|${this.fitKey}`;
    if (sk !== this.shadowKey || this.debris) { this.renderer.shadowMap.needsUpdate = true; this.shadowKey = sk; }
    this.renderer.render(this.scene, this.camera);
    this.dirty = false;
  }
}

// ---------------------------------------------------------------- platform

function makePlatform(R, theme) {
  const g = new THREE.Group();
  const thick = 1.05, rr = 0.42;
  const pts = [];
  pts.push(new THREE.Vector2(0, 0));
  pts.push(new THREE.Vector2(R - rr, 0));
  for (let i = 1; i <= 8; i++) { const a = i / 8 * Math.PI / 2; pts.push(new THREE.Vector2(R - rr + Math.sin(a) * rr, -rr + Math.cos(a) * rr)); }
  pts.push(new THREE.Vector2(R, -thick + 0.3));
  for (let i = 1; i <= 6; i++) { const a = i / 6 * Math.PI / 2; pts.push(new THREE.Vector2(R - 0.3 + Math.cos(a) * 0.3, -thick + 0.3 - Math.sin(a) * 0.3)); }
  pts.push(new THREE.Vector2(0, -thick));
  const geo = new THREE.LatheGeometry(pts.reverse(), 96);
  const mat = new THREE.MeshPhysicalMaterial({ color: theme.platform, roughness: 0.36, clearcoat: 0.5, clearcoatRoughness: 0.28, envMapIntensity: 0.45 });
  const disc = new THREE.Mesh(geo, mat);
  disc.receiveShadow = true; disc.castShadow = false;
  g.add(disc);
  // soft ambient shadow under the platform
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shared().blob, transparent: true, depthWrite: false, opacity: theme.blob }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = -thick - 0.35; blob.scale.setScalar(R * 2.9);
  g.add(blob);
  return g;
}

// ---------------------------------------------------------------- particles

class Particles {
  constructor(tex) {
    this.max = 600;
    const geo = new THREE.BufferGeometry();
    this.pos = new Float32Array(this.max * 3); this.col = new Float32Array(this.max * 3); this.size = new Float32Array(this.max); this.alpha = new Float32Array(this.max);
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('color', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('size', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('alpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    const mat = new THREE.ShaderMaterial({
      uniforms: { map: { value: tex }, scale: { value: 600 } },
      vertexShader: `attribute float size; attribute float alpha; attribute vec3 color; varying vec3 vC; varying float vA;
        uniform float scale;
        void main(){ vC = color; vA = alpha; vec4 mv = modelViewMatrix * vec4(position,1.0); gl_PointSize = size * scale / -mv.z; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform sampler2D map; varying vec3 vC; varying float vA;
        void main(){ vec4 t = texture2D(map, gl_PointCoord); gl_FragColor = vec4(vC * t.rgb, t.a * vA); }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    this.points = new THREE.Points(geo, mat);
    this.points.frustumCulled = false;
    this.parts = [];
    this.alive = 0;
  }
  burst(center, hex, count, soft = false) {
    const base = new THREE.Color(hex);
    for (let i = 0; i < count; i++) {
      const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.9 - 0.2, Math.random() - 0.5).normalize();
      const sp = soft ? 1.6 + Math.random() * 3.2 : 3 + Math.random() * 6;
      const white = Math.random() < 0.35;
      const c = white ? new THREE.Color(1, 1, 1) : base.clone().lerp(new THREE.Color(1, 1, 1), 0.3);
      this.parts.push({ p: center.clone(), v: dir.multiplyScalar(sp), c, life: 0, max: soft ? 0.55 + Math.random() * 0.45 : 0.35 + Math.random() * 0.35, s: soft ? 0.7 + Math.random() * 0.8 : 0.6 + Math.random() * 0.9 });
    }
    if (this.parts.length > this.max) this.parts.splice(0, this.parts.length - this.max);
    this.alive = this.parts.length;
  }
  trail(p, hex) {
    const c = new THREE.Color(hex).lerp(new THREE.Color(1, 1, 1), 0.55);
    this.parts.push({ p: p.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4)), v: new THREE.Vector3(0, 0.4, 0), c, life: 0, max: 0.28 + Math.random() * 0.2, s: 0.35 + Math.random() * 0.35 });
    this.alive = this.parts.length;
  }
  update(dt) {
    let k = 0;
    const keep = [];
    for (const p of this.parts) {
      p.life += dt;
      if (p.life >= p.max) continue;
      p.v.multiplyScalar(Math.exp(-dt * 3.2)); p.v.y -= 4 * dt;
      p.p.addScaledVector(p.v, dt);
      const u = p.life / p.max;
      this.pos[k * 3] = p.p.x; this.pos[k * 3 + 1] = p.p.y; this.pos[k * 3 + 2] = p.p.z;
      this.col[k * 3] = p.c.r; this.col[k * 3 + 1] = p.c.g; this.col[k * 3 + 2] = p.c.b;
      this.size[k] = p.s * (1 - u * 0.5); this.alpha[k] = (1 - u) * (u < 0.1 ? u * 10 : 1);
      k++; keep.push(p);
    }
    this.parts = keep; this.alive = keep.length;
    const g = this.points.geometry;
    g.setDrawRange(0, k);
    for (const nm of ['position', 'color', 'size', 'alpha']) g.getAttribute(nm).needsUpdate = true;
  }
}

class SpriteFactory {
  constructor() {
    this.canvas = document.createElement('canvas');
    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
    this.renderer.setClearColor(0x000000, 0);
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.toneMapping = THREE.NeutralToneMapping;
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    this.env = studioEnvironment(this.renderer);
    this.cache = new Map();
  }
  shot(scene, camera, w, h) {
    this.renderer.setPixelRatio(1);
    this.renderer.setSize(w, h, false);
    this.renderer.render(scene, camera);
    return toObjectURL(this.canvas);
  }
  lightScene() {
    const s = new THREE.Scene();
    s.environment = this.env;
    s.add(new THREE.HemisphereLight(0xf2f5ff, 0x6a70c8, 1.5));
    const k = new THREE.DirectionalLight(0xfff6ea, 2.7); k.position.set(-3, 5, 4); s.add(k);
    const f = new THREE.DirectionalLight(0xffffff, 0.8); f.position.set(0.5, 0.5, 6); s.add(f);
    return s;
  }
  magnet(hex, pol, px = 160) {
    const key = `m${hex}${pol}${px}`;
    if (this.cache.has(key)) return this.cache.get(key);
    const s = this.lightScene();
    const ball = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), magnetMaterial(hex, pol));
    s.add(ball);
    // contact shade under the ball
    const cam = new THREE.PerspectiveCamera(22, 1, 0.1, 50); cam.position.set(0, 0.35, 5.6); cam.lookAt(0, 0, 0);
    ball.lookAt(cam.position);
    const url = this.shot(s, cam, px, px);
    this.cache.set(key, url);
    return url;
  }
  /** Cannon with the loaded magnet (one image per magnet, plus an empty one): a chunky glossy cyan
   *  mortar leaning back on a royal-blue base plate, an arched foot in front, the magnet sitting
   *  high in the muzzle so most of it shows. */
  cannon(px = 256, hex = null, pol = 1) {
    const key = `cannon3${px}${hex}${pol}`;
    if (this.cache.has(key)) return this.cache.get(key);
    const mat = (c, o = {}) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.2, clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 0.95, ...o });
    const s = this.lightScene();
    const fill = new THREE.DirectionalLight(0xdfe8ff, 0.8); fill.position.set(3, 1.5, 6); s.add(fill);
    const rim = new THREE.DirectionalLight(0xbfe6ff, 1.0); rim.position.set(2.5, 3, -5); s.add(rim);
    const cam = new THREE.PerspectiveCamera(27, 1, 0.1, 60); cam.position.set(0, 2.3, 9.2); cam.lookAt(0, 1.25, 0);
    // base plate: a solid disc with a rounded rim and a darker socket where the barrel sits
    const bp = [];
    const B = (x, y) => bp.push(new THREE.Vector2(x, y));
    B(0, 0.36); B(1.55, 0.36);
    for (let i = 1; i <= 8; i++) { const a = i / 8 * Math.PI / 2; B(1.55 + Math.sin(a) * 0.2, 0.16 + Math.cos(a) * 0.2); }
    B(1.75, 0.08); B(1.7, 0.0); B(0, 0.0);
    const plate = new THREE.Mesh(new THREE.LatheGeometry(bp.reverse(), 96), mat(0x1C4FD6, { roughness: 0.3 }));
    const socket = new THREE.Mesh(new THREE.CircleGeometry(1.24, 64), mat(0x10338F, { roughness: 0.6, clearcoat: 0.3 }));
    socket.rotation.x = -Math.PI / 2; socket.position.y = 0.365;
    const rimRing = new THREE.Mesh(new THREE.TorusGeometry(1.26, 0.07, 12, 72), mat(0x3C79F0, { roughness: 0.25 }));
    rimRing.rotation.x = Math.PI / 2; rimRing.position.y = 0.37;
    s.add(plate, socket, rimRing);
    // barrel: short and fat, a slight belly, a thick rounded lip, dark inside
    const prof = [];
    const P = (x, y) => prof.push(new THREE.Vector2(x, y));
    P(0.0, 0.0); P(0.72, 0.0); P(1.0, 0.1); P(1.1, 0.42); P(1.16, 1.2); P(1.14, 2.1);
    for (let i = 0; i <= 14; i++) { const a = i / 14 * Math.PI; P(0.98 + Math.cos(a) * 0.19, 2.2 + Math.sin(a) * 0.2); }
    P(0.79, 2.08); P(0.78, 1.6);
    const barrel = new THREE.Mesh(new THREE.LatheGeometry(prof, 112), mat(0x1ECDFB));
    const inside = new THREE.Mesh(new THREE.CircleGeometry(0.83, 64), new THREE.MeshBasicMaterial({ color: 0x0B3D8C }));
    inside.rotation.x = -Math.PI / 2; inside.position.y = 1.7;
    const gun = new THREE.Group();
    gun.add(barrel, inside);
    const BALL_Y = 2.1;
    if (hex) {
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.78, 72, 54), magnetMaterial(hex, pol));
      ball.position.set(0, BALL_Y, 0);
      gun.add(ball);
      this._ball = ball;
    }
    // the barrel leans up, towards the viewer and a little to the left, so its right flank shows
    gun.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(-0.42, 0.64, 0.64).normalize());
    gun.position.set(0.42, 0.45, -0.95);
    s.add(gun);
    // arched foot, chunky and rounded
    const foot = new THREE.Mesh(new THREE.ExtrudeGeometry(archShape(0.84, 0.92), { depth: 0.56, bevelEnabled: true, bevelSize: 0.13, bevelThickness: 0.13, bevelSegments: 8, curveSegments: 28 }), mat(0x20C8F7));
    foot.position.set(0.2, 0.34, 0.7);
    s.add(foot);
    gun.updateMatrixWorld();
    if (hex) { this._ball.lookAt(cam.position); }
    const url = this.shot(s, cam, px, px);
    const mz = new THREE.Vector3(0, BALL_Y, 0).applyMatrix4(gun.matrixWorld).project(cam);
    const out = { url, muzzle: { x: (mz.x + 1) / 2, y: (1 - mz.y) / 2 } };
    this.cache.set(key, out);
    return out;
  }
  /** Figure on a cream platform, for the collection and level cards. */
  thumb(level, data, palette, w = 360, h = 300, theme = 'warm', dark = false, view = null) {
    const st = new Stage(this.renderer, { theme, env: this.env, shadowSize: 1024 });
    st.setLevel(level, data, { palette, noFrost: true });
    st.pitch = view?.pitch ?? 24; st.yaw = view?.yaw ?? -0.45;
    st.turn.rotation.y = st.yaw;
    st.setRect({ x: 0, y: 0, w, h }, w, h);
    st.margin = 0.06; st.apron = 2; st.fitYaws = [st.yaw];
    if (dark) {
      const ink = new THREE.Color(0x4a4468);
      for (let k = 0; k < st.cubes.count; k++) st.cubes.setColorAt(k, ink);
      st.cubes.instanceColor.needsUpdate = true;
      for (const d of st.decor) d.obj.visible = false;
    }
    this.renderer.setPixelRatio(2);
    this.renderer.setSize(w, h, false);
    st.frame();
    this.renderer.render(st.scene, st.camera);
    const url = toObjectURL(this.canvas);
    st.clearLevel();
    return url;
  }
}

/** Canvas → a short blob: URL (cheap to assign to many <img> elements, decoded once). */
function toObjectURL(canvas) {
  const d = canvas.toDataURL('image/png');
  try {
    const bin = atob(d.slice(d.indexOf(',') + 1)), n = bin.length, u8 = new Uint8Array(n);
    for (let i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([u8], { type: 'image/png' }));
  } catch (e) { return d; }
}

function createRenderer(canvasEl) {
  const r = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true, stencil: true, powerPreference: 'high-performance' });
  r.setClearColor(0x000000, 0);
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.NeutralToneMapping;
  r.toneMappingExposure = 1.0;
  r.shadowMap.enabled = true;
  r.shadowMap.type = THREE.PCFSoftShadowMap;
  r.shadowMap.autoUpdate = false;
  return r;
}

  // ---------------------------------------------------------------- input

      if (e.type === 'pointerup' && performance.now() - d.t0 < 900) this.tapAt(e.clientX, e.clientY);

  }
  pickAt(x, y) { return this.stage.pick(x, y, this.canvas.getBoundingClientRect()); }

  previewAt(x, y) {

    const v = this.pickAt(x, y);
    if (v === this.previewV) return;
    this.previewV = v;
    if (v < 0) { this.clearPreview(true); return; }
    const m = armedMagnet(this.state);
    const comp = component(this.level, this.state.alive, v);
    const frozen = !!this.state.frozen[this.level.clusterOf[v]];
    const ok = m >= 0 && attracts(m, this.level.type[v]) && !frozen;
    const show = frozen ? false : this.assist ? ok : true;   // later levels: no verdict, just the group
    this.stage.setStates(comp.map(w => [w, show ? 1 : 2]).concat(this.hintVoxels.map(w => [w, 3])));

  clearPreview(keepV = false) {

    $('#g-overlay').innerHTML = '';

  get hintVoxels() { return this._hint || []; }
  set hintVoxels(v) { this._hint = v; this.stage.hintActive = v.length > 0; }

  drawAim(v, count, ok, m) {

    const tp = this.stage.toScreen(this.stage.voxelWorld(v));
    const mz = this.muzzleScreen();
    // cannon aims at the target
    const ang = Math.atan2(tp.x - mz.x, mz.y - tp.y) * 180 / Math.PI;

      const x = a * a * mz2.x + 2 * a * u * midx + u * u * tp.x, y = a * a * mz2.y + 2 * a * u * midy + u * u * tp.y;

  tapAt(x, y) {
    if (this.busy || !this.state || this.state.phase !== 'play') return;
    const v = this.pickAt(x, y);
    if (v < 0) return;
    const step = this.coachSteps[this.coachIdx];

    void step;
  }

  arm(src, i) {
    if (this.busy || !this.state || this.state.phase !== 'play') return;
    const step = this.coachSteps[this.coachIdx];
    if (step?.lockNext && src === 'q' && i !== 0) { toast('Fire the magnet that is in the cannon first.'); haptic(this.app.settings.haptics, 20); return; }
    if (this.state.armed.src === src && this.state.armed.i === i) return;
    if (!canArm(this.state, src, i)) return;
    this.state.armed = { src, i };
    this.app.sound.arm();
    haptic(this.app.settings.haptics, 6);
    this.previewV = -2;
    this.renderHUD();

  // ---------------------------------------------------------------- the shot
  async shoot(v) {
    const s = this.state;
    const m = armedMagnet(s);
    if (m < 0) return;
    this.busy = true;
    const snap = cloneState(s);
    const ev = fire(this.level, s, v);
    if (!ev) { this.busy = false; return; }
    this.undoSnap = snap; this.lastSnap = snap;
    this.hintVoxels = [];

    const ball = await this.stage.flyMagnetTo(from, v, PAL[m >> 1], typePol(m), rm ? 0.16 : 0.44);
    if (ev.kind === 'hit') {
      S.attract(ev.removed.length, m >> 1);
      haptic(this.app.settings.haptics, 14);
      await this.stage.attract(ev.removed, ball, PAL[m >> 1], rm, v);
      for (const w of ev.removed) { this.stage.alive[w] = 0; this.stage.hidden[w] = 0; }

      S.pop();
      this.hits++;
      this.combo++; this.bestCombo = Math.max(this.bestCombo, this.combo);
      if (this.combo >= 2) { S.combo(this.combo); this.popCombo(this.stage.toScreen(ball.position)); }
      if (ev.thawed && ev.thawed.length) {
        this.stage.thaw(ev.thawed, rm);
        S.crack(); haptic(this.app.settings.haptics, 18);
        this.coachEvent('thaw');
      }
      this.coachEvent('hit');
    } else {
      S.bonk(); haptic(this.app.settings.haptics, 30);
      const grp = component(this.level, s.alive, v);
      this.stage.setStates(grp.map(w => [w, 2]));
      const p = await this.stage.bounce(ball, v, rm);
      this.stage.setStates([]);
      const sp = this.stage.toScreen(p);
      this.stage.removeBall(ball, false);
      await this.flyToSlot(sp, ev.slot, m);
      S.clack(); haptic(this.app.settings.haptics, 12);
      this.misfires++;
      this.combo = 0;
      if (ev.reason === 'frozen') toast('That group is frozen. Pull a group next to it first.');
      this.landSlot = ev.slot;
      this.coachEvent('store');
    }
    this.renderHUD();
    if (s.phase === 'won') { await this.win(); }
    else if (s.phase === 'lost') { await this.lose(); }
    else if (s.stored.filter(x => x >= 0).length === SLOTS - 1) S.warn();
    this.busy = false;
  }
  /** Floating "COMBO ×n" label where the magnet burst. */
  popCombo(p) {

    el.style.left = `${Math.max(60, Math.min(this.canvas.clientWidth - 60, p.x))}px`;
    el.style.top = `${Math.max(this.stage.rect.y + 40, p.y)}px`;
    $('#g-overlay').parentNode.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }
  flyToSlot(from, slot, m) {
    return new Promise(resolve => {
      const sock = $$('#g-stored .socket')[slot];
      const c = this.canvas.getBoundingClientRect(), r = sock.getBoundingClientRect();
      const img = document.createElement('img');
      img.className = 'flying'; img.src = this.magnetImg(m);
      $('#game').appendChild(img);
      const x0 = from.x + c.left, y0 = from.y + c.top, x1 = r.left + r.width / 2, y1 = r.top + r.height / 2;
      const dur = this.app.reduceMotion ? 180 : 460, t0 = performance.now();

        if (u < 1) requestAnimationFrame(step); else { img.remove(); resolve(); }

    });
  }

  // ---------------------------------------------------------------- tools
  /** Hints per try: free during the lessons, then 3 / 2 / 1 as the tiers get harder. */
  // per-level allowances written by the level builder (they shrink as the levels get harder)
  hintAllowance() { const h = this.data.hints ?? 3; return h < 0 ? Infinity : h; }
  undoAllowance() { return this.data.undo ?? 1; }
  get assist() { return this.data.assist !== false; }
  hint() {
    if (this.busy || !this.state || this.state.phase !== 'play') return;
    if (!(this.hintsLeft > 0)) { toast(this.hintAllowance() === 0 ? 'No hints on this level. You are on your own.' : 'No hints left for this try. Restart gives you a fresh set.'); return; }
    this.app.sound.hint();
    this.usedHint = true;
    if (this.hintsLeft !== Infinity) this.hintsLeft--;
    this.coachEvent('hint');
    const cur = this.nearestView();
    let st = null;
    const step = this.coachSteps[this.coachIdx];
    if (step?.lockNext && this.state.shots === 0) {
      const p = this.data.plan[0];
      st = { kind: p.k === 'h' ? 'hit' : 'store', src: p.src, i: p.i, voxel: this.level.voxelAt(...p.v), view: p.w };
    } else st = strategyStep(this.level, this.vis, this.state, this.rank, cur);
    if (!st) { toast('No safe move from here. Try Undo or Restart.'); return; }
    if (!(this.state.armed.src === st.src && this.state.armed.i === st.i) && canArm(this.state, st.src, st.i)) {
      this.state.armed = { src: st.src, i: st.i };
      this.renderHUD();
    }
    this.turnTo(st.view);
    const m = armedMagnet(this.state);
    if (st.kind === 'hit') {
      this.hintVoxels = component(this.level, this.state.alive, st.voxel);
      this.stage.setStates(this.hintVoxels.map(w => [w, 3]));
      toast(`Fire the ${magnetName(m)} magnet at the glowing group.`);
    } else {
      this.hintVoxels = [st.voxel];
      this.stage.setStates([[st.voxel, 3]]);
      toast('Nothing can take this magnet yet. Fire it at any cube to park it in STORED.');
    }
    clearTimeout(this.hintTimer);
    this.hintTimer = setTimeout(() => { this.hintVoxels = []; if (!this.busy) this.stage.setStates([]); }, 4200);
    this.renderHUD();
  }
  nearestView() {
    let best = 0, bd = 1e9;
    const yawDeg = ((this.stage.yaw * 180 / Math.PI) % 360 + 360) % 360;
    VIEWS.forEach((v, i) => {
      const vy = ((v.yaw % 360) + 360) % 360;
      let d = Math.abs(vy - yawDeg); d = Math.min(d, 360 - d);
      const dist = d + Math.abs(v.pitch - this.stage.pitch) * 0.5;
      if (dist < bd) { bd = dist; best = i; }
    });
    return best;
  }
  turnTo(w) {
    const v = VIEWS[w];
    const y0 = this.stage.yaw, p0 = this.stage.pitch;
    let target = v.yaw * Math.PI / 180;
    // shortest way round
    while (target - y0 > Math.PI) target -= Math.PI * 2;
    while (target - y0 < -Math.PI) target += Math.PI * 2;
    const p1 = Math.max(PITCH_MIN, Math.min(PITCH_MAX, v.pitch));
    if (Math.abs(target - y0) < 0.02 && Math.abs(p1 - p0) < 1) return;
    this.stage.yawVel = 0;
    this.stage.tween(this.app.reduceMotion ? 0.05 : 0.55, (u) => {
      const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      this.stage.yaw = y0 + (target - y0) * e;
      this.stage.pitch = p0 + (p1 - p0) * e;
    });
  }
  undo() {
    if (this.busy || !this.state) return;
    if (!(this.undoLeft > 0 && this.undoSnap)) { toast(this.undoAllowance() === 0 ? 'No undo on this level. Every shot counts.' : this.undoLeft > 0 ? 'Nothing to undo yet.' : 'Undo is used up for this try. Restart gives you a fresh one.'); return; }
    this.state = this.undoSnap; this.undoSnap = null; this.undoLeft--; this.usedUndo = true; this.combo = 0;
    this.syncStage();
    this.app.sound.undo();
    this.app.closeModal();
    this.renderHUD(true);
    this.coachEvent('undo');
  }
  /** A rewarded video was watched after a loss: go back to just before the losing shot and empty
   *  the storage — the parked magnets move to the end of the queue, so none is lost and the level
   *  can still be finished. */
  canRevive() { return !!this.state && this.state.phase === 'lost' && this.state.lossReason === 'full' && this.revivesLeft > 0 && !!this.lastSnap; }
  revive() {
    if (!this.canRevive()) return false;
    const s = cloneState(this.lastSnap);
    const parked = s.stored.filter(m => m >= 0);
    s.stored = s.stored.map(() => -1);
    s.queue.push(...parked);
    s.phase = 'play'; s.lossReason = null; s.armed = { src: 'q', i: 0 };
    this.state = s;
    this.lastSnap = null; this.undoSnap = null; this.revivesLeft--; this.revived = true; this.combo = 0;
    this.syncStage();
    this.app.sound.undo();
    this.app.closeModal();
    this.renderHUD(true);
    toast(parked.length ? 'Storage cleared. Keep going!' : 'Back in the game!');
    return true;
  }
  restart() {
    if (this.busy) return;
    this.state = initialState(this.level);
    this.undoLeft = this.undoAllowance(); this.undoSnap = null; this.misfires = 0; this.usedUndo = false; this.usedHint = false;
    this.hintsLeft = this.hintAllowance(); this.combo = 0; this.bestCombo = 0;
    this.revivesLeft = AD_CONFIG.revives ?? 1; this.lastSnap = null; this.revived = false;
    this.syncStage();
    this.app.sound.back();
    this.app.closeModal();
    this.renderHUD(true);
  }
  syncStage() {
    const st = this.stage;
    if (st.debris) { st.debris.mesh.parent?.remove(st.debris.mesh); st.debris = null; }
    st.alive = this.state.alive.slice();
    st.hidden.fill(0);
    for (const d of st.decor) { d.gone = false; d.obj.visible = true; }
    st.setFrozen(this.state.frozen);
    this.vis.reset();
    this.hintVoxels = [];
    this.clearPreview();
  }
  pause() {
    if (!this.state || this.state.phase !== 'play') return;
    this.app.openPause();
  }

  // ---------------------------------------------------------------- end of level
  async win() {
    this.app.syncGameplay();               // level complete: gameplay stops here
    const S = this.app.sound;
    S.win();
    const st = this.stage;
    const c = st.target();
    for (let i = 0; i < 5; i++) setTimeout(() => { const p = c.clone(); p.x += (Math.random() - 0.5) * st.platR; p.z += (Math.random() - 0.5) * st.platR; p.y = 0.6 + Math.random() * 2; st.particles.burst(p, PAL[i % 8], 30); st.dirty = true; }, i * 120);
    confetti(['#FF526A', '#FFD64D', '#36D8FF', '#62D868', '#965FFF', '#F16DCB', '#FF9A3D'], this.app.reduceMotion);
    const planStores = this.data.plan.filter(p => p.k === 's').length;
    // three stars: no wasted shots beyond the planned parking, no undo, no hint
    const clean = this.misfires <= planStores && !this.usedUndo && !this.revived && !(this.usedHint && this.data.id > 8);
    const stars = clean ? 3 : (this.misfires <= planStores + 2 ? 2 : 1);
    // a boss level (every 20th) beaten for the first time is one of the game's big moments
    if (this.data.boss && !this.app.isDone(this.data.id)) portal.happytime();
    this.app.completeLevel(this.data.id, stars);
    await new Promise(r => setTimeout(r, this.app.reduceMotion ? 300 : 1100));
    this.app.openWin(this.data, stars, this.bestCombo);
  }
  async lose() {
    this.app.syncGameplay();               // game over: gameplay stops here
    this.app.sound.lose();
    haptic(this.app.settings.haptics, 60);
    this.stage.collapse();
    await new Promise(r => setTimeout(r, this.app.reduceMotion ? 300 : 1300));
    this.app.openLose(this.undoLeft > 0 && !!this.undoSnap, this.canRevive(), this.state.lossReason);
  }

  bindButtons() {
    if (!TOUCH) for (const [id, t] of [['#btn-hint', 'Hint (H)'], ['#btn-undo', 'Undo (U)'], ['#btn-restart', 'Restart (R)'], ['#btn-pause', 'Pause (P)']]) $(id).title = t;
    $('#btn-hint').addEventListener('click', () => this.hint());
    $('#btn-undo').addEventListener('click', () => this.undo());
    $('#btn-restart').addEventListener('click', () => this.app.confirmRestart());
    $('#btn-pause').addEventListener('click', () => { this.app.sound.tap(); this.pause(); });
  }

  // ---------------------------------------------------------------- keyboard (desktop)
  /** Arrows / WASD turn and tilt the figure (held), 1–3 load from NEXT, 4–7 load a stored magnet,
   *  C loads the cannon's own magnet again, H hint, U / Z / Backspace undo, R restart, P pause. */
  key(e) {
    if (!this.state || !this.running) return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const turn = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'n', s: 'n' }[k];
    if (turn) { e.preventDefault(); this.keys.add(turn); this.stage.yawVel = 0; return; }
    if (e.repeat) return;
    if (/^[1-3]$/.test(k)) {
      const b = this.nextEls && this.nextEls[+k - 1];
      if (b) b.click();
      return;
    }
    if (/^[4-7]$/.test(k)) {
      const i = +k - 4;
      if (this.state.stored[i] >= 0) this.arm('s', i);
      return;
    }
    if (k === 'c') { if (this.state.armed?.src === 's') this.arm('q', 0); return; }
    if (k === 'h') { this.hint(); return; }
    if (k === 'u' || k === 'z' || k === 'Backspace') { e.preventDefault(); this.undo(); return; }
    if (k === 'r') { this.app.confirmRestart(); return; }
    if (k === 'p') { this.app.sound.tap(); this.pause(); }
  }
  keyUp(e) {
    if (!e) { this.keys.clear(); return; }
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const turn = { ArrowLeft: 'l', a: 'l', ArrowRight: 'r', d: 'r', ArrowUp: 'u', w: 'u', ArrowDown: 'n', s: 'n' }[k];
    if (turn) this.keys.delete(turn);
  }
  /** Held keys turn the figure at a steady speed (frame-rate independent). */
  turnByKeys(dt) {
    if (this.busy && this.stage.tweens.length) return;
    const K = this.keys;
    const yaw = (K.has('r') ? 1 : 0) - (K.has('l') ? 1 : 0), pitch = (K.has('n') ? 1 : 0) - (K.has('u') ? 1 : 0);
    if (yaw) { this.stage.yaw += yaw * 2.4 * dt; this.rotated += Math.abs(2.4 * dt); if (this.rotated > 1.2) this.coachEvent('rotate'); }
    if (pitch) this.stage.pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, this.stage.pitch + pitch * 55 * dt));
    if (yaw || pitch) { this.stage.dirty = true; if (this.previewV >= 0) this.clearPreview(); }
  }

  // ---------------------------------------------------------------- tutorial coach
  showCoach() {
    const el = $('#g-coach');
    const step = this.coachSteps[this.coachIdx];
    this.fingerAt = null;
    $('#g-finger')?.remove();
    if (!step) { el.classList.add('hidden'); return; }
    el.textContent = step.text;
    // make room for the note (it can wrap to two or three lines)
    this.placeCoach();
    const h = el.offsetHeight;
    if (Math.abs(h - (this.coachH || 0)) > 1) { this.coachH = h; this.resize(); }
    el.classList.remove('hidden');
    if (step.finger) {
      const f = document.createElement('div');
      f.id = 'g-finger'; f.className = 'finger'; f.innerHTML = icon('finger', '');
      $('#game').appendChild(f);
      this.fingerAt = this.data.plan[this.state.shots];
    }
    this.highlightCoachTargets();
  }
  /** The coach's note: above STORED (portrait) or under the figure in the middle column (landscape). */
  placeCoach() {
    const el = $('#g-coach'), k = this.app.k || 1;
    const gr = $('#game').getBoundingClientRect();
    if (this.app.land) {
      const sc = $('#g-scene').getBoundingClientRect();
      el.style.left = `${sc.left - gr.left + sc.width / 2}px`;
      el.style.width = `${Math.min(sc.width * 0.96, 400 * k)}px`;
      el.style.top = `${sc.bottom - gr.top - (this.coachBand || 60) + Math.round(4 * k)}px`;
    } else {
      const lab = $('#g-stored-label').getBoundingClientRect();
      el.style.left = ''; el.style.width = '';
      el.style.top = `${lab.top - gr.top - (this.coachBand || 60) + Math.round(2 * k)}px`;
    }
  }
  placeFinger() {
    const f = $('#g-finger'), p = this.fingerAt;
    if (!f || !p) return;
    const v = this.level.voxelAt(...p.v);
    if (v < 0 || !this.state.alive[v]) { f.style.display = 'none'; return; }
    const sp = this.stage.toScreen(this.stage.voxelWorld(v));
    const c = this.canvas.getBoundingClientRect(), g = $('#game').getBoundingClientRect();
    f.style.display = 'block';
    const fs = (f.offsetWidth || 48) / 48;
    f.style.left = `${sp.x + c.left - g.left - 12 * fs}px`; f.style.top = `${sp.y + c.top - g.top + 4 * fs}px`;
  }
  highlightCoachTargets() {
    const step = this.coachSteps[this.coachIdx];
    $$('#g-next .socket').forEach(s => s.classList.toggle('hl', step?.until === 'armed'));
    $$('#g-stored .socket').forEach(s => s.classList.toggle('hl', !!(step && this.data?.id === 4 && this.coachIdx === 1 && !s.classList.contains('empty'))));
    $('#btn-hint').classList.toggle('pressed', false);
  }
  coachEvent(kind) {
    const step = this.coachSteps[this.coachIdx];
    if (!step) return;
    const done = step.until === kind || (step.until === 'hit2' && kind === 'hit' && this.hits >= 2);
    if (done) { this.coachIdx++; this.showCoach(); }
  }
}

// ---- page/main.js
// main.js — app shell: screens, progress, settings, home preview, level map, collection, modals.

const STORE_KEY = 'voxelbreak.web.v1';
const CHAPTER = 20;
const CHAPTERS = ['Sunrise', 'Daydream', 'Lemonade', 'Bubblegum', 'Starlight', 'Moonbeam', 'Snowflake', 'Honeycomb', 'Marshmallow', 'Rainbow',
  'Stardust', 'Blossom', 'Seashell', 'Firefly', 'Lullaby', 'Comet', 'Aurora', 'Velvet', 'Crystal', 'Nebula', 'Thunder', 'Eclipse', 'Galaxy', 'Legend', 'Infinity'];
/** Plan steps are stored compactly as [hit, src, i, x, y, z, view]; the game reads objects. */
function expandLevel(L) {
  if (L.plan.length && Array.isArray(L.plan[0])) L.plan = L.plan.map(a => ({ k: a[0] ? 'h' : 's', src: a[1] ? 's' : 'q', i: a[2], v: [a[3], a[4], a[5]], w: a[6] }));
  return L;
}
/** A short line about a chapter's rules, from its first level. */
function rulesLine(L) {
  const load = L.pick >= 4 ? 'Load any of 3 ahead' : L.pick === 3 ? 'Load 2 ahead' : L.pick === 2 ? 'Load 1 ahead' : 'Cannon only';
  const hints = L.hints < 0 ? 'free hints' : L.hints === 0 ? 'no hints' : `${L.hints} hint${L.hints > 1 ? 's' : ''}`;
  return `${load} · ${hints}${L.undo ? '' : ' · no undo'}`;
}

function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); if (s && typeof s === 'object') return s; } catch (e) { /* storage unavailable */ }
  return null;
}

class App {
  constructor(levels) {
    this.levels = levels.map(expandLevel);
    this.total = this.levels.length;
    const saved = loadSave() || {};
    this.progress = { completed: {}, ...(saved.progress || {}) };
    this.settings = { music: true, effects: true, haptics: true, reduceMotion: false, unlockAll: false, ...(saved.settings || {}) };
    this.sound = new Sound();
    this.sound.music = this.settings.music; this.sound.effects = this.settings.effects;
    this.sprites = new SpriteFactory();
    this.thumbs = new Map();
    this.screen = null;
    hydrate();
    this.renderTabs();
    this.modalOpen = false;
    this.ads = new Ads(this);
    this.setScale();
    this.game = new Game(this);
    this.bind();
    this.homeStage = null;
    // the window's resize sets the layout scale (again one frame later: during a resize some browsers
    // still report the old size); the 3D canvases follow their REAL box through a ResizeObserver, so a
    // portal iframe resize, a phone rotation or a late layout pass never leaves a stretched or blank view
    window.addEventListener('resize', () => { this.setScale(); this.resizeHome(); requestAnimationFrame(() => this.setScale()); });
    if (typeof ResizeObserver === 'function') {
      const ro = new ResizeObserver(() => { this.resizeHome(); this.game.resize(false); });
      ro.observe($('#homegl')); ro.observe($('#gl'));
    }
    document.addEventListener('pointerdown', () => this.sound.unlock(), { once: false, passive: true });
    // the portal silences every AudioContext during ads / when its mute setting is on; the music
    // scheduler waits meanwhile, so no notes pile up and play at once afterwards
    this.sound.adPaused = portal.audioBlocked();
    portal.on('audiomute', () => { this.sound.adPaused = true; });
    portal.on('audiounmute', () => { this.sound.adPaused = false; this.sound.wake(); });
  }
  /** Layout scale --k. Portrait (phones): the reference layouts are 375 x 667 and larger screens
   *  scale up to a limit. Landscape (desktop 16:9 frames, phones held sideways, tablets): a
   *  side-by-side layout designed for a logical 889 x 500 frame, scaled uniformly to the viewport. */
  setScale() {
    // the height left between the notch / status bar and the home indicator
    const ins = safeInsets();
    const W = window.innerWidth, Hh = window.innerHeight;
    const land = W >= Hh * 1.15 && W >= 560;
    let k;
    if (land) k = Math.max(0.55, Math.min(3, (Hh - ins.top - ins.bottom) / 500, W / 889));
    else k = Math.max(0.74, Math.min(1.28, Math.min(W, 480) / 375, (Hh - ins.top - ins.bottom) / 667));
    this.land = land;
    this.k = k;
    const root = document.documentElement;
    root.classList.toggle('land', land);
    root.classList.toggle('port', !land);
    root.style.setProperty('--k', k.toFixed(3));
  }
  get reduceMotion() { return this.settings.reduceMotion || window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  save() {
    const json = JSON.stringify({ progress: this.progress, settings: this.settings, t: Date.now() });
    try { localStorage.setItem(STORE_KEY, json); } catch (e) { /* ignore */ }
  }
  isDone(id) { return !!this.progress.completed[id]; }
  doneCount() { return Object.keys(this.progress.completed).length; }
  nextLevel() { for (let i = 1; i <= this.total; i++) if (!this.isDone(i)) return i; return this.total; }
  unlocked(id) { return this.settings.unlockAll || id <= this.nextLevel() || this.isDone(id); }
  completeLevel(id, stars) { this.progress.completed[id] = Math.max(stars, this.progress.completed[id] || 0); this.save(); }

  // ---------------------------------------------------------------- screens
  show(name) {
    if (this.screen === name) return;
    this.screen = name;
    for (const s of $$('.screen')) s.classList.toggle('on', s.id === name);
    if (name !== 'game') this.game.stop();
    if (name === 'home') this.refreshHome(); else this.stopHome();
    if (name === 'levels') this.renderLevels();
    if (name === 'collection') this.renderCollection();
    $$('[data-tabs] .btn').forEach(b => b.classList.toggle('cur', b.dataset.to === name));
    this.syncGameplay();
  }
  /** Tells the portal whether the player is in active play right now: on the play screen, a level
   *  running, no dialog (pause, settings, result) over it and no ad break in progress. */
  syncGameplay() {
    const g = this.game, st = g && g.state;
    portal.gameplay(this.screen === 'game' && !this.modalOpen && !this.ads.showing && !!st && st.phase === 'play' && !!g.running);
  }
  play(id) {
    if (!this.unlocked(id)) return;
    this.sound.unlock(); this.sound.tap();
    this.closeModal();
    this.show('game');
    requestAnimationFrame(() => this.game.start(this.levels[id - 1]));
  }
  renderTabs() {
    for (const nav of $$('[data-tabs]')) {
      nav.innerHTML = `
        <button class="btn orange" data-to="home">${icon('home')}<span>Home</span></button>
        <button class="btn lav" data-to="levels">${icon('levels')}<span>Levels</span></button>
        <button class="btn mint" data-to="collection">${icon('collection')}<span>Collection</span></button>`;
    }
  }
  bind() {
    document.addEventListener('click', (e) => {
      const to = e.target.closest('[data-to]');
      if (to) { this.sound.unlock(); this.sound.tap(); haptic(this.settings.haptics, 6); this.show(to.dataset.to); }
      const set = e.target.closest('[data-open-settings]');
      if (set) { this.sound.tap(); this.openSettings(); }
    });
    $('#btn-settings').addEventListener('click', () => { this.sound.unlock(); this.sound.tap(); this.openSettings(); });
    $('#btn-play').addEventListener('click', () => this.play(this.nextLevel()));
    $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal' && this.modalDismiss) this.modalDismiss(); });
    document.addEventListener('pointerdown', () => { this.keyboardUser = false; }, true);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') this.keyboardUser = true;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Escape') { if ($('#modal').classList.contains('on') && this.modalDismiss) this.modalDismiss(); else if (this.screen === 'game') this.game.pause(); return; }
      // Enter: the main button of the open dialog (Next level, Try again, Resume …) or Play on Home
      if (e.key === 'Enter' && !e.repeat && !(e.target && e.target.closest && e.target.closest('button'))) {
        if ($('#modal').classList.contains('on')) { const b = $('#sheet [data-primary]'); if (b && !b.disabled) { e.preventDefault(); b.click(); } return; }
        if (this.screen === 'home') { e.preventDefault(); this.sound.unlock(); $('#btn-play').click(); return; }
      }
      if (this.screen === 'game' && !$('#modal').classList.contains('on')) this.game.key(e);
    });
    document.addEventListener('keyup', (e) => { if (this.screen === 'game') this.game.keyUp(e); });
    window.addEventListener('blur', () => this.game.keyUp(null));
  }

  // ---------------------------------------------------------------- home
  refreshHome() {
    const next = this.nextLevel(), done = this.doneCount();
    $('#home-level').textContent = `LEVEL ${next}`;
    $('#btn-play').innerHTML = `<span>${done >= this.total ? 'PLAY AGAIN' : `PLAY LEVEL ${next}`}</span>`;
    $('#home-done').textContent = `${done} / ${this.total} completed`;
    $('#home-bar').style.width = `${Math.max(2, done / this.total * 100)}%`;
    const nodes = [];
    for (const id of [next - 1, next, next + 1]) {
      if (id < 1 || id > this.total) { nodes.push(''); continue; }
      const st = this.isDone(id) ? 'done' : id === next ? 'now' : 'locked';
      const badge = st === 'done' ? `<span class="badge">${icon('check', '')}</span>` : st === 'locked' ? `<span class="badge">${icon('lock', '')}</span>` : '';
      nodes.push(`<div class="node ${st}">${id}${badge}</div>`);
    }
    $('#home-nodes').innerHTML = nodes.filter(Boolean).join('<i class="link"></i>');
    this.startHome(next);
  }
  startHome(id) {
    const cv = $('#homegl');
    if (!this.homeRenderer) { this.homeRenderer = createRenderer(cv); this.homeStage = new Stage(this.homeRenderer, { theme: 'warm', shadowSize: 1024 }); }
    const data = this.levels[id - 1];
    if (this.homeLevelId !== id) {
      this.homeLevelId = id;
      this.homeStage.setLevel(new LevelModel(data), data, { palette: PAL });
      this.homeStage.pitch = data.fig === 'castle' ? 11 : 16; this.homeStage.yaw = data.fig === 'castle' ? 0 : -0.5;
      this.homeStage.margin = 0.04; this.homeStage.apron = 2;
      const y0 = this.homeStage.yaw; this.homeStage.fitYaws = [y0 - 0.22, y0, y0 + 0.22];
    }
    this.resizeHome();
    this.homeRunning = true;
    let last = performance.now(), t0 = last;
    const tick = (now) => {
      if (!this.homeRunning) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!this.reduceMotion) this.homeStage.yaw = (this.homeStage.baseYaw ?? this.homeStage.yaw) + Math.sin((now - t0) / 1000 * 0.35) * 0.22;
      if (this.homeStage.baseYaw === undefined) this.homeStage.baseYaw = this.homeStage.yaw;
      this.homeStage.update(dt, now / 1000);
      // 30 fps is plenty for a slow turntable and saves battery
      if (this.reduceMotion) { if (this.homeStage.dirty) this.homeStage.render(); }
      else if ((this.homeFrame = (this.homeFrame || 0) + 1) % 2 === 0) this.homeStage.render();
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  stopHome() { this.homeRunning = false; if (this.homeStage) this.homeStage.baseYaw = undefined; }
  resizeHome() {
    if (!this.homeRenderer) return;
    const cv = $('#homegl'), r = cv.getBoundingClientRect();
    // supersampled a little on 1x screens (a small preview), real pixels on large ones; never above 2x
    const big = r.width * r.height > 300000;
    this.homeRenderer.setPixelRatio(Math.min(2, Math.max(big ? 1 : 1.6, window.devicePixelRatio || 1)));
    this.homeRenderer.setSize(r.width, r.height, false);
    // landscape: the preview card grows with the frame, so the cube size cap grows with the layout too
    this.homeStage.maxCubePx = this.land ? Math.round(30 * this.k) : undefined;
    this.homeStage.setRect({ x: 8, y: 30, w: r.width - 16, h: r.height - 38 }, r.width, r.height);
  }

  // ---------------------------------------------------------------- level map
  renderLevels() {
    const next = this.nextLevel(), chapters = Math.ceil(this.total / CHAPTER);
    let html = '';
    for (let c = 0; c < chapters; c++) {
      const a = c * CHAPTER + 1, b = Math.min(this.total, a + CHAPTER - 1);
      let cells = '', done = 0;
      for (let id = a; id <= b; id++) {
        if (this.isDone(id)) done++;
        const st = this.isDone(id) ? 'done' : id === next ? 'now' : this.unlocked(id) ? '' : 'locked';
        const boss = this.levels[id - 1].boss ? ' boss' : '';
        const badge = st === 'done' ? `<span class="badge">${icon('check', '')}</span>` : st === 'locked' ? `<span class="badge">${icon('lock', '')}</span>` : '';
        cells += `<button class="node ${st}${boss}" data-level="${id}" aria-label="Level ${id}${boss ? ', boss level' : ''}${st === 'locked' ? ', locked' : ''}">${id}${badge}</button>`;
      }
      const here = next >= a && next <= b;
      html += `<section class="tier${here ? ' here' : ''}" data-chapter="${c + 1}"><h3><span>${c + 1}. ${CHAPTERS[c % CHAPTERS.length]}</span><em>${done}/${b - a + 1}</em></h3><p class="rules">${rulesLine(this.levels[Math.min(b, a + 4) - 1])}</p><div class="grid5">${cells}</div></section>`;
    }
    $('#level-list').innerHTML = html;
    for (const b of $$('#level-list [data-level]')) b.addEventListener('click', () => {
      const id = +b.dataset.level;
      if (!this.unlocked(id)) { this.sound.back(); toast(`Finish level ${this.nextLevel()} to unlock more.`); return; }
      this.play(id);
    });
    // open at the chapter being played
    const cur = $('#level-list .tier.here');
    if (cur) requestAnimationFrame(() => cur.scrollIntoView({ block: 'start' }));
  }

  // ---------------------------------------------------------------- collection
  figureLevels() {
    const map = new Map();
    for (const L of this.levels) { if (!map.has(L.fig)) map.set(L.fig, []); map.get(L.fig).push(L); }
    return map;
  }
  renderCollection() {
    const grid = $('#fig-grid');
    const figs = this.figureLevels();
    const cards = [];
    for (const [fig, list] of figs) {
      const got = list.filter(L => this.isDone(L.id));
      const show = got.length ? got[got.length - 1] : list[0];
      const locked = !got.length;
      cards.push({ fig, show, locked, name: show.name, first: list[0].id, count: got.length, total: list.length });
    }
    grid.innerHTML = cards.map(c => `<button class="fig-card ${c.locked ? 'locked' : ''}" data-fig="${c.fig}" data-lv="${c.show.id}">
        <span class="shot" id="shot-${c.fig}"><span class="ph"></span></span>
        <b>${c.locked ? 'Locked' : c.name}</b><small>${c.locked ? `Level ${c.first}` : `${c.count} of ${c.total} built`}</small></button>`).join('');
    for (const b of $$('#fig-grid .fig-card')) b.addEventListener('click', () => {
      const lv = +b.dataset.lv;
      if (b.classList.contains('locked')) { this.sound.back(); toast(`Reach level ${lv} to meet this figure.`); return; }
      this.play(lv);
    });
    // thumbnails render one per frame so the screen stays responsive
    let i = 0;
    const next = () => {
      if (this.screen !== 'collection' || i >= cards.length) return;
      const c = cards[i++];
      const url = this.thumbFor(c.show, c.locked);
      const slot = $(`#shot-${c.fig}`);
      if (slot) slot.innerHTML = `<img src="${url}" alt="${c.locked ? 'Locked figure' : c.name}">`;
      setTimeout(next, 16);
    };
    setTimeout(next, 30);
  }
  thumbFor(L, dark = false) {
    const key = `${L.id}${dark ? 'd' : ''}`;
    if (!this.thumbs.has(key)) this.thumbs.set(key, this.sprites.thumb(new LevelModel(L), L, PAL, 360, 300, 'warm', dark));
    return this.thumbs.get(key);
  }

  /** Leaves the level being played (Restart or Home). A real attempt (at least `abandonShots` shots)
   *  that is given up ends a game, as in the original ad rule: a natural break, so the portal may
   *  show an ad before `then` (the new try, or Home) — never while playing. */
  leaveGame(reason, then) {
    const g = this.game;
    if (g.state && g.state.phase === 'play' && g.state.shots >= AD_CONFIG.abandonShots) { this.ads.breakThen(reason, then); return; }
    then();
  }
  restartGame() { this.leaveGame('restart', () => { this.closeModal(); this.game.restart(); }); }

  // ---------------------------------------------------------------- modals
  openModal(html, cls, dismiss = null) {
    // a fresh sheet element each time, so click handlers of earlier dialogs never fire again
    const old = $('#sheet'), sh = old.cloneNode(false);
    old.replaceWith(sh);
    sh.className = `sheet ${cls}`;
    sh.innerHTML = html;
    this.modalDismiss = dismiss;
    $('#modal').classList.add('on');
    this.modalOpen = true;
    this.game.keyUp(null);
    this.syncGameplay();
    // move focus into the dialog only for keyboard users
    if (this.keyboardUser) sh.querySelector('button')?.focus({ preventScroll: true });
    return sh;
  }
  closeModal() {
    $('#modal').classList.remove('on');
    this.modalDismiss = null;
    this.modalOpen = false;
    this.syncGameplay();
  }
  openPause() {
    const sh = this.openModal(`<h2>Paused</h2><p>Level ${this.game.data.id} · ${this.game.data.name}</p>
      <div class="btns two">
        <button class="btn orange" data-a="resume" data-primary>${icon('play', 'ico', 'orange')}<span>Resume</span></button>
        <button class="btn" data-a="restart">${icon('restart', 'ico', 'blue')}<span>Restart level</span></button>
        <button class="btn ghost" data-a="settings">${icon('gear', 'ico', 'ghost')}<span>Settings</span></button>
        <button class="btn ghost" data-a="home">${icon('home', 'ico', 'ghost')}<span>Home</span></button>
      </div>`, 'night', () => { this.sound.tap(); this.closeModal(); });
    let done = false;
    sh.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (!a || done) return;
      done = true;
      this.sound.tap();
      if (a === 'resume') this.closeModal();
      if (a === 'restart') this.restartGame();
      if (a === 'settings') this.openSettings(true);
      if (a === 'home') this.leaveGame('quit-level', () => { this.show('home'); this.closeModal(); });
    });
  }
  confirmRestart() {
    if (!this.game.state || this.game.busy) return;
    if (this.game.state.shots === 0) { this.game.restart(); return; }
    this.sound.tap();
    const sh = this.openModal(`<h2>Start over?</h2><p>The figure is rebuilt and your storage empties.</p>
      <div class="btns two"><button class="btn orange" data-a="yes" data-primary>${icon('restart', 'ico', 'orange')}<span>Restart</span></button><button class="btn ghost" data-a="no"><span>Keep playing</span></button></div>`, 'night', () => this.closeModal());
    let done = false;
    sh.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (!a || done) return;
      done = true;
      if (a === 'yes') this.restartGame(); else { this.sound.tap(); this.closeModal(); }
    });
  }
  openWin(L, stars, bestCombo = 0) {
    const last = L.id >= this.total;
    const st = [0, 1, 2].map(i => icon(i < stars ? 'star' : 'star-off', '')).join('');
    const sh = this.openModal(`<div class="stars">${st}</div><h2>Level complete!</h2>
      <div class="fig"><img src="${this.thumbFor(L)}" alt="${L.name}"></div>
      <p>${L.name} collected${stars === 3 ? ' — a clean run, no wasted shots and no help.' : '.'}</p>
      ${bestCombo >= 2 ? `<div class="chip-row"><span class="chip">Best combo <b>×${bestCombo}</b></span></div>` : ''}
      <div class="btns${last ? '' : ' two'}">${last ? '' : `<button class="btn orange" data-a="next" data-primary>${icon('play', 'ico', 'orange')}<span>Next: level ${L.id + 1}</span></button>`}
        <button class="btn ghost" data-a="home"${last ? ' data-primary' : ''}>${icon('home', 'ico', 'ghost')}<span>Home</span></button></div>`, 'night win', null);
    sh.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      // leaving the result screen is the natural break: the portal may show an ad first
      if (a === 'next') { this.sound.tap(); this.ads.breakThen('next-level', () => this.play(L.id + 1)); }
      if (a === 'home') { this.sound.tap(); this.ads.breakThen('level-complete', () => { this.show('home'); this.closeModal(); }); }
    });
  }
  openLose(canUndo, canRevive = false, reason = 'full') {
    const empty = reason === 'empty';
    const video = `<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="11" width="38" height="27" rx="8" fill="#fff"/><rect x="5" y="11" width="38" height="27" rx="8" fill="none" stroke="#C24D0A" stroke-opacity=".35" stroke-width="2"/><path d="M20.5 18v13l11-6.5Z" fill="#F77C12"/></svg>`;
    // rewarded "Continue": only where the portal can serve rewarded videos. "Try again" (the way
    // without a video) then gets the very same look, so neither choice is pushed.
    const rv = canRevive && this.ads.rewardedOn;
    const sh = this.openModal(`<h2>${empty ? 'Out of magnets' : 'Storage overloaded'}</h2><p>${empty ? 'Every magnet is used up but some cubes are still standing.' : `All ${SLOTS} sockets filled up and the figure fell apart. Park only the magnets that have nothing to pull yet.`}</p>
      ${rv ? '<p class="rv-note">Watch a short video to continue: your storage empties and you keep this figure.</p>' : ''}
      <div class="btns two">${rv ? `<button class="btn orange rv" data-a="revive">${video}<span class="rv-label">Continue</span><span class="ad-pill">AD</span></button>` : ''}
        ${!rv && canUndo ? `<button class="btn orange" data-a="undo">${icon('undo', 'ico', 'orange')}<span>Undo last shot</span></button>` : ''}
        <button class="btn ${rv || !canUndo ? 'orange' : ''}" data-a="retry" data-primary>${icon('restart', 'ico', rv || !canUndo ? 'orange' : 'blue')}<span>Try again</span></button>
        ${rv && canUndo ? `<button class="btn" data-a="undo">${icon('undo', 'ico', 'blue')}<span>Undo last shot</span></button>` : ''}
        <button class="btn ghost" data-a="home">${icon('home', 'ico', 'ghost')}<span>Home</span></button></div>`, 'night', null);
    const rvBtn = sh.querySelector('[data-a="revive"]');
    let busy = false;
    sh.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-a]')?.dataset.a;
      if (!a || busy) return;
      if (a === 'revive') {
        busy = true; this.sound.tap();
        rvBtn.disabled = true;
        const ok = await this.ads.rewarded('continue');
        busy = false;
        if (!rvBtn.isConnected) return;
        // the reward only when the video was really watched: back to just before the losing shot
        if (ok && this.game.revive()) return;
        rvBtn.disabled = false;
        toast('No video right now. Please try again later.');
        return;
      }
      this.sound.tap();
      if (a === 'undo') this.game.undo();
      if (a === 'retry') this.ads.breakThen('game-over', () => this.game.restart());
      if (a === 'home') this.ads.breakThen('game-over', () => { this.show('home'); this.closeModal(); });
    });
  }
  openSettings(fromPause = false) {
    const row = (key, title, note) => `<div class="set-row"><span>${title}${note ? `<small>${note}</small>` : ''}</span><button class="switch" id="set-${key}" role="switch" aria-checked="${!!this.settings[key]}" aria-label="${title}"><i></i></button></div>`;
    const night = this.screen === 'game';
    const touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    const keys = touch ? '' : '<div class="fine keys">Mouse: click a cube to fire, drag or scroll to turn the figure.<br>Keys: arrows / WASD turn · 1–3 load NEXT · 4–7 load STORED · H hint · U undo · R restart · P pause</div>';
    const sh = this.openModal(`<h2>Settings</h2>
      <div class="rows">${row('music', 'Music')}${row('effects', 'Sound effects')}${touch ? row('haptics', 'Vibration', 'On phones that support it') : ''}
      ${row('reduceMotion', 'Reduce motion', 'Shorter, calmer animations')}${row('unlockAll', 'Unlock all levels', 'Play any level in any order')}</div>
      <div class="btns two"><button class="btn ${night ? 'orange' : 'green'}" data-a="done" data-primary><span>Done</span></button>
      <button class="btn ${night ? 'ghost' : 'lav'}" data-a="reset"><span>Reset progress</span></button></div>
      ${keys}
      <div class="fine">Voxel Break · ${this.total} levels, ${this.figureLevels().size} kinds of figures. Your progress is saved automatically.</div>`, night ? 'night set' : 'day set', () => this.closeSettings(fromPause));
    for (const k of ['music', 'effects', 'haptics', 'reduceMotion', 'unlockAll']) {
      sh.querySelector(`#set-${k}`)?.addEventListener('click', (e) => {
        this.settings[k] = !this.settings[k];
        e.currentTarget.setAttribute('aria-checked', this.settings[k]);
        this.sound.unlock();
        if (k === 'music') this.sound.setMusic(this.settings.music);
        if (k === 'effects') this.sound.setEffects(this.settings.effects);
        this.sound.tap();
        this.save();
      });
    }
    sh.querySelector('[data-a="done"]').addEventListener('click', () => { this.sound.tap(); this.closeSettings(fromPause); });
    sh.querySelector('[data-a="reset"]').addEventListener('click', (e) => {
      const b = e.currentTarget;
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.querySelector('span').textContent = touch ? 'Tap again to erase' : 'Click again to erase'; return; }
      this.progress.completed = {}; this.save(); this.thumbs.clear();
      b.querySelector('span').textContent = 'Progress erased';
      if (this.screen === 'home') this.refreshHome();
    });
  }
  closeSettings(fromPause) {
    if (fromPause) this.openPause(); else this.closeModal();
    if (this.screen === 'home') this.refreshHome();
    if (this.screen === 'levels') this.renderLevels();
  }
}

// ---------------------------------------------------------------- boot
/** The level data ships gzip-compressed (LEVELS_GZ, base64) or plain (LEVELS). */
async function unpackLevels() {
  if (typeof LEVELS !== 'undefined') return LEVELS;
  const bin = Uint8Array.from(atob(LEVELS_GZ), c => c.charCodeAt(0));
  let text;
  if (typeof DecompressionStream !== 'undefined') {
    const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    text = await new Response(stream).text();
  } else {
    const { gunzipSync, strFromU8 } = await import('./vendor/fflate.js');
    text = strFromU8(gunzipSync(bin));
  }
  return JSON.parse(text);
}
function webglOK() {
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; }
}
async function boot() {
  try { await document.fonts.ready; } catch (e) { /* fonts optional */ }
  if (!webglOK()) {
    $('#loading').innerHTML = '<p style="max-width:300px;text-align:center;color:#3A1D4A;font:800 18px var(--ui);line-height:1.4">Voxel Break needs WebGL to draw its 3D figures. Open it in a current version of Chrome, Edge, Firefox or Safari.</p>';
    portal.loadingDone();
    return;
  }
  let levels;
  try { levels = await unpackLevels(); }
  catch (e) {
    $('#loading').innerHTML = '<p style="max-width:300px;text-align:center;color:#3A1D4A;font:800 18px var(--ui);line-height:1.4">The levels could not be unpacked in this browser. Open Voxel Break in a current version of Chrome, Edge, Firefox or Safari.</p>';
    portal.loadingDone();
    return;
  }
  // the saves are read only after the portal SDK is ready: on CrazyGames the adapter maps
  // localStorage onto the SDK's Data module (cloud save) at that moment
  await portal.ready();
  const app = new App(levels);
  // read-only handle for the portal preview recorder (reports/voxelbreak/autoplay.mjs); not used by the game
  window.__vb = app;
  app.show('home');
  const ld = $('#loading');
  ld.classList.add('done');
  setTimeout(() => ld.remove(), 500);
  portal.loadingDone();
  // a hidden tab goes quiet and comes back as it was (shots are player-driven: nothing runs meanwhile)
  document.addEventListener('visibilitychange', () => app.sound.background(document.hidden));
}
boot();

</script>
</body>
</html>
