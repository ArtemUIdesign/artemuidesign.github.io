<div id="app">
  <canvas id="bg-canvas"></canvas>
  <!-- the stage holds everything but the backdrop; on wide screens it is laid out at a fixed
       logical height and scaled to the window (ui/stage.js) -->
  <div id="stage">

  <!-- ============ GAME ============ -->
  <div id="game-area">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="hud" class="layer hidden">
    <div class="hud-top">
      <button class="icon-btn round" id="btn-pause" aria-label="Pause" data-i18n-aria="common.pause">
        <svg class="ic solid"><use href="#i-pause"/></svg>
      </button>
      <div class="score-block">
        <div class="score-value" id="hud-score">0</div>
        <div class="score-best"><span data-i18n="common.best">Best</span> <span id="hud-best">0</span></div>
      </div>
      <div class="hud-right">
        <button class="coin-pill" id="hud-coins" aria-label="Coins" data-i18n-aria="common.coins"><i class="coin-icon"></i><span id="hud-coins-value">0</span><span class="coin-plus"><svg class="ic"><use href="#i-plus"/></svg></span></button>
        <div class="next-chip"><span class="next-label" data-i18n="common.next">Next</span><canvas id="hud-next" width="40" height="40"></canvas></div>
      </div>
      <!-- web build: keyboard controls, shown on wide mouse + keyboard screens only (styles/web.css) -->
      <div class="key-hint" aria-hidden="true">
        <span class="keys"><kbd>←</kbd><kbd>→</kbd><span data-i18n="web.aim">move</span></span>
        <span class="keys"><kbd>Space</kbd><span data-i18n="web.drop">drop</span></span>
        <span class="keys"><kbd>1</kbd>–<kbd>5</kbd><span data-i18n="web.column">column</span></span>
      </div>
    </div>
    <div class="hud-bottom">
      <button class="power-btn" data-power="hammer">
        <span class="power-icon medal-hammer"><svg class="ic"><use href="#i-hammer"/></svg></span>
        <span class="power-name" data-i18n="power.hammer">Hammer</span>
        <span class="power-cost"><i class="coin-icon small"></i><span data-cost="hammer">100</span></span>
        <span class="power-uses" data-uses="hammer"></span>
        <span class="power-own hidden" data-own="hammer">0</span>
        <span class="power-key" aria-hidden="true">H</span>
      </button>
      <button class="power-btn" data-power="joker">
        <span class="power-icon joker-icon medal-joker">∞</span>
        <span class="power-name" data-i18n="power.joker">Joker</span>
        <span class="power-cost"><i class="coin-icon small"></i><span data-cost="joker">150</span></span>
        <span class="power-uses" data-uses="joker"></span>
        <span class="power-own hidden" data-own="joker">0</span>
        <span class="power-key" aria-hidden="true">J</span>
      </button>
      <button class="power-btn" data-power="undo">
        <span class="power-icon medal-undo"><svg class="ic"><use href="#i-undo"/></svg></span>
        <span class="power-name" data-i18n="power.undo">Undo</span>
        <span class="power-cost"><i class="coin-icon small"></i><span data-cost="undo">50</span></span>
        <span class="power-uses" data-uses="undo"></span>
        <span class="power-own hidden" data-own="undo">0</span>
        <span class="power-key" aria-hidden="true">U</span>
      </button>
    </div>
    <div class="hammer-hint hidden" id="hammer-hint">
      <span class="hint-medal medal-hammer"><svg class="ic"><use href="#i-hammer"/></svg></span><span data-i18n="power.tapBlock">Tap a block to smash it</span>
      <button class="btn secondary small" id="hammer-cancel" data-i18n="common.cancel">Cancel</button>
    </div>
  </div>

  <!-- ============ MAIN MENU ============ -->
  <div id="screen-menu" class="layer screen">
    <div class="menu-top">
      <button class="coin-pill" id="menu-coins-btn" aria-label="Get coins" data-i18n-aria="menu.getCoins"><i class="coin-icon"></i><span id="menu-coins">0</span><span class="coin-plus"><svg class="ic"><use href="#i-plus"/></svg></span></button>
      <button class="icon-btn round" id="btn-settings" aria-label="Settings" data-i18n-aria="common.settings"><svg class="ic"><use href="#i-gear"/></svg></button>
    </div>
    <!-- side rails: free daily rewards on the left; the coins video on the right (when the portal offers videos) -->
    <div class="rail rail-left" id="rail-left">
      <button class="rail-btn c-orange" id="btn-daily"><span class="rail-icon"><svg class="ic"><use href="#i-calendar"/></svg></span><span class="rail-label" data-i18n="live.daily">Daily</span><small class="rail-tag" id="daily-tag">Day 1</small></button>
      <button class="rail-btn c-purple" id="btn-spin"><span class="rail-icon"><svg class="ic"><use href="#i-wheel"/></svg></span><span class="rail-label" data-i18n="live.spin">Spin</span><small class="rail-tag" id="spin-tag"></small></button>
    </div>
    <div class="rail rail-right hidden" id="rail-right">
      <button class="rail-btn c-green" id="btn-menu-ad"><span class="rail-icon"><svg class="ic"><use href="#i-video"/></svg></span><span class="rail-label" data-i18n="common.coins">Coins</span><small class="rail-tag">+60</small></button>
    </div>
    <div class="menu-wrap">
      <div class="logo">
        <canvas id="menu-hero" aria-hidden="true"></canvas>
        <h1 class="logo-text" aria-label="Tumblio"><span class="lt" style="--i:0;--c:#F6C445">T</span><span class="lt" style="--i:1;--c:#F79A3E">U</span><span class="lt" style="--i:2;--c:#E9637A">M</span><span class="lt" style="--i:3;--c:#59B8E7">B</span><span class="lt" style="--i:4;--c:#5DC87E">L</span><span class="lt" style="--i:5;--c:#9B6EE0">I</span><span class="lt" style="--i:6;--c:#3EC1B5">O</span></h1>
        <div class="menu-best hidden" id="menu-best-wrap">
          <span class="best-medal"><svg class="ic"><use href="#i-trophy"/></svg></span>
          <span class="best-text"><small data-i18n="common.best">Best</small><b id="menu-best">0</b></span>
          <span class="best-top"><small data-i18n="common.top">Top</small><b id="menu-top">-</b></span>
        </div>
      </div>
      <div class="menu-buttons">
        <button class="btn play big" id="btn-continue"><span class="play-badge"><svg class="ic"><use href="#i-play"/></svg></span><span class="btn-label" data-i18n="common.continue">Continue</span></button>
        <button class="btn play big" id="btn-play"><span class="play-badge"><svg class="ic"><use href="#i-play"/></svg></span><span class="btn-label" data-i18n="common.play">Play</span></button>
        <div class="menu-dock">
          <button class="dock-btn c-pink" id="btn-shop"><span class="dock-icon"><svg class="ic"><use href="#i-shop"/></svg></span><span class="dock-label" data-i18n="common.shop">Shop</span></button>
          <button class="dock-btn c-green" id="btn-missions"><span class="dock-icon"><svg class="ic"><use href="#i-target"/></svg></span><span class="dock-label" data-i18n="live.missions">Missions</span><small class="dock-tag" id="missions-tag">0/5</small></button>
          <button class="dock-btn c-purple" id="btn-pass"><span class="dock-icon"><svg class="ic"><use href="#i-star"/></svg></span><span class="dock-label" data-i18n="live.pass">Pass</span><small class="dock-tag" id="pass-tag">Lv 0</small></button>
          <button class="dock-btn c-orange" id="btn-chests"><span class="dock-icon"><svg class="ic"><use href="#i-chest-mini"/></svg></span><span class="dock-label" data-i18n="live.chests">Chests</span><small class="dock-tag" id="chest-timer"></small></button>
        </div>
      </div>
      <div class="menu-footer">v1.0</div>
    </div>
  </div>

  <!-- ============ PAUSE ============ -->
  <div id="screen-pause" class="layer modal hidden">
    <div class="modal-card pause-card">
      <h2 class="modal-title" data-i18n="pause.title">Paused</h2>
      <div class="pause-stats"><span><span data-i18n="common.score">Score</span> <b id="pause-score">0</b></span><i class="dot"></i><span><span data-i18n="common.best">Best</span> <b id="pause-best">0</b></span></div>
      <button class="btn play big" id="pause-resume"><span class="play-badge"><svg class="ic"><use href="#i-play"/></svg></span><span class="btn-label" data-i18n="common.resume">Resume</span></button>
      <div class="modal-row">
        <button class="btn c-blue" id="pause-restart"><svg class="ic btn-glyph"><use href="#i-restart"/></svg><span data-i18n="common.restart">Restart</span></button>
        <button class="btn c-purple" id="pause-home"><svg class="ic btn-glyph"><use href="#i-home"/></svg><span data-i18n="common.home">Home</span></button>
      </div>
      <div class="round-row">
        <button class="round-btn toggle" id="pause-sound" aria-label="Sound" data-i18n-aria="common.sound"><svg class="ic"><use href="#i-sound"/></svg></button>
        <button class="round-btn toggle" id="pause-music" aria-label="Music" data-i18n-aria="common.music"><svg class="ic"><use href="#i-music"/></svg></button>
        <button class="round-btn toggle" id="pause-haptics" aria-label="Haptics" data-i18n-aria="common.haptics"><svg class="ic"><use href="#i-haptics"/></svg></button>
        <button class="round-btn c-pink" id="pause-shop" aria-label="Shop" data-i18n-aria="common.shop"><svg class="ic"><use href="#i-shop"/></svg></button>
        <button class="round-btn c-blue" id="pause-settings" aria-label="Settings" data-i18n-aria="common.settings"><svg class="ic"><use href="#i-gear"/></svg></button>
      </div>
    </div>
  </div>

  <!-- ============ GAME OVER ============ -->
  <div id="screen-gameover" class="layer modal hidden">
    <div class="modal-card gameover-card">
      <div class="go-newbest hidden" id="go-newbest"><svg class="ic"><use href="#i-trophy"/></svg><span data-i18n="go.newBest">New best</span></div>
      <h2 class="modal-title" id="go-title" data-i18n="go.title">Game over</h2>
      <!-- go-sum / go-actions: layout-neutral (display: contents) except in the wide layout, where
           the results sit left of the buttons (styles/web.css) -->
      <div class="go-sum">
      <div class="go-score" id="go-score">0</div>
      <div class="go-stats">
        <span class="go-chip"><svg class="ic"><use href="#i-trophy"/></svg><b id="go-best">0</b></span>
        <span class="go-chip"><i class="coin-icon small"></i><b id="go-coins">+0</b></span>
        <span class="go-chip"><svg class="ic"><use href="#i-sparkle"/></svg><b id="go-chain">x1</b></span>
      </div>
      </div>
      <div class="go-actions">
      <button class="btn reward big" id="go-continue"><span class="btn-icon"><svg class="ic"><use href="#i-video"/></svg></span><span class="btn-text" data-i18n="go.continue">Continue</span> <small>watch a video · top rows cleared</small></button>
      <button class="btn reward" id="go-double"><span class="btn-icon"><svg class="ic"><use href="#i-video"/></svg></span><span class="btn-text" data-i18n="go.double">Double coins</span> <small id="go-double-amount">+0</small></button>
      <button class="btn play big" id="go-restart"><span class="play-badge"><svg class="ic"><use href="#i-restart"/></svg></span><span class="btn-label" data-i18n="common.playAgain">Play again</span></button>
      <div class="modal-row">
        <button class="btn secondary" id="go-home"><svg class="ic btn-glyph"><use href="#i-home"/></svg><span data-i18n="common.home">Home</span></button>
      </div>
      </div>
    </div>
  </div>

  <!-- ============ SHOP ============ -->
  <div id="screen-shop" class="layer screen hidden">
    <div class="screen-head">
      <button class="icon-btn round" id="shop-close" aria-label="Close" data-i18n-aria="common.close"><svg class="ic"><use href="#i-close"/></svg></button>
      <h1 data-i18n="shop.title">Shop</h1>
      <div class="coin-pill static"><i class="coin-icon"></i><span id="shop-coins">0</span></div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="skins" data-i18n="shop.skins">Skins</button>
      <button class="tab" data-tab="themes" data-i18n="shop.maps">Maps</button>
      <button class="tab hidden" data-tab="coins" data-i18n="shop.coins">Coins</button>
    </div>
    <div class="shop-body" id="shop-body"></div>
  </div>

  <!-- ============ SETTINGS ============ -->
  <div id="screen-settings" class="layer screen hidden">
    <div class="screen-head">
      <button class="icon-btn round" id="settings-close" aria-label="Close" data-i18n-aria="common.close"><svg class="ic"><use href="#i-close"/></svg></button>
      <h1 data-i18n="settings.title">Settings</h1>
      <span class="head-spacer"></span>
    </div>
    <div class="settings-body">
      <div class="settings-group">
        <button class="settings-row" id="set-language"><span><svg class="ic"><use href="#i-globe"/></svg><span data-i18n="settings.language">Language</span></span><span class="set-value"><span id="set-language-value">English</span><svg class="ic"><use href="#i-chev"/></svg></span></button>
      </div>
      <div class="settings-group">
        <button class="settings-row" id="set-sound"><span><svg class="ic"><use href="#i-sound"/></svg><span data-i18n="settings.sound">Sound effects</span></span><span class="switch" data-on="true"></span></button>
        <button class="settings-row" id="set-music"><span><svg class="ic"><use href="#i-music"/></svg><span data-i18n="settings.music">Music</span></span><span class="switch" data-on="true"></span></button>
        <button class="settings-row" id="set-haptics"><span><svg class="ic"><use href="#i-haptics"/></svg><span data-i18n="settings.haptics">Haptics</span></span><span class="switch" data-on="true"></span></button>
        <button class="settings-row" id="set-hints"><span><svg class="ic"><use href="#i-bulb"/></svg><span data-i18n="settings.hints">Landing hints</span></span><span class="switch" data-on="true"></span></button>
      </div>
      <div class="settings-group">
        <div class="settings-stats" id="settings-stats"></div>
      </div>
      <div class="settings-group">
        <button class="settings-row danger" id="set-reset"><span data-i18n="settings.reset">Reset all progress</span><span class="chev"><svg class="ic"><use href="#i-chev"/></svg></span></button>
      </div>
      <div class="settings-version">Tumblio v1.0</div>
    </div>
  </div>

  <!-- ============ MISSIONS / PASS / CHESTS ============ -->
  <div id="screen-live" class="layer screen hidden">
    <div class="screen-head">
      <button class="icon-btn round" id="live-close" aria-label="Close" data-i18n-aria="common.close"><svg class="ic"><use href="#i-close"/></svg></button>
      <h1 id="live-title">Missions</h1>
      <div class="coin-pill static"><i class="coin-icon"></i><span id="live-coins">0</span></div>
    </div>
    <div class="tabs" id="live-tabs">
      <button class="tab active" data-tab="daily" data-i18n="missions.daily">Daily</button>
      <button class="tab" data-tab="weekly" data-i18n="missions.weekly">Weekly</button>
      <button class="tab" data-tab="goals" data-i18n="missions.goals">Goals</button>
    </div>
    <div class="shop-body live-body" id="live-body"></div>
  </div>
  <div id="live-modal" class="layer hidden"></div>

  <div id="dialog" class="layer modal hidden"></div>
  <div id="toast"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
